<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Unbreakable Games — private preview</title>
<style>
  :root{ --aqua:#57FFF1; --pink:#EC3186; --orange:#FF6A13; }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0}
  body{background:#000; color:#fff; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

  /* ---- password gate ---- */
  .ug-gate{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; background:radial-gradient(120% 90% at 50% 0%, #141417 0%, #000 60%)}
  .ug-card{width:100%; max-width:380px; text-align:center}
  .ug-mark{font-weight:800; letter-spacing:-.01em; font-size:15px; text-transform:lowercase;
    background:linear-gradient(100deg,var(--pink),var(--orange)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
  .ug-title{margin:18px 0 6px; font-size:22px; font-weight:800; letter-spacing:-.02em}
  .ug-sub{margin:0 0 26px; font-size:14px; line-height:1.5; color:#9a9aa2}
  .ug-form{display:flex; gap:8px}
  .ug-input{flex:1; min-width:0; padding:12px 14px; border:1px solid #2e2e34; border-radius:0; background:#0d0d0f; color:#fff; font-size:15px; outline:none}
  .ug-input:focus{border-color:var(--aqua)}
  .ug-btn{flex:none; padding:12px 18px; border:none; border-radius:0; background:var(--aqua); color:#000; font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; cursor:pointer}
  .ug-btn:disabled{opacity:.5; cursor:progress}
  .ug-err{min-height:18px; margin:14px 0 0; font-size:13px; color:#ff8f8f; opacity:0; transition:opacity .2s}
  .ug-err.show{opacity:1}

  /* ---- device-preview harness (hidden until unlocked) ---- */
  .ug-app{display:none; height:100vh; flex-direction:column; background:#0a0a0b}
  .ug-app.on{display:flex}
  .ug-tb{position:relative; flex:none; height:54px; display:flex; align-items:center; justify-content:center; background:#111114; border-bottom:1px solid #26262b; z-index:10}
  .ug-wlabel{position:absolute; right:18px; font-size:12px; color:#8a8a92; font-variant-numeric:tabular-nums}
  .ug-seg{display:inline-flex; gap:4px; background:#1b1b1f; border:1px solid #2e2e34; border-radius:11px; padding:4px}
  .ug-seg button{display:inline-flex; align-items:center; gap:7px; padding:7px 15px; border:none; border-radius:8px; background:transparent; color:#9a9aa2; font-size:13px; font-weight:500; cursor:pointer; transition:color .2s, background .2s}
  .ug-seg button:hover{color:#d6d6da}
  .ug-seg button.active{background:linear-gradient(100deg,#EC3186,#FF6A13); color:#fff}
  .ug-stage{flex:1; overflow:auto; display:flex; justify-content:center; align-items:stretch}
  .ug-frame{flex:1; width:100%; border:0; background:#000; display:block; transition:width .42s cubic-bezier(.2,.7,.2,1)}
  .ug-stage.mobile{align-items:flex-start; padding:26px 16px}
  .ug-stage.mobile .ug-frame{flex:none; width:390px; height:820px; max-height:calc(100vh - 54px - 52px); border-radius:36px; border:11px solid #1b1b1f; box-shadow:0 24px 70px rgba(0,0,0,.55)}
  @media (prefers-reduced-motion:reduce){.ug-frame{transition:none}}
</style>

<div class="ug-gate" id="ug-gate">
  <div class="ug-card">
    <div class="ug-mark">unbreakable games</div>
    <h1 class="ug-title">private preview</h1>
    <p class="ug-sub">This page is password-protected. Enter the password shared with you to view the design.</p>
    <form class="ug-form" id="ug-form" autocomplete="off">
      <input class="ug-input" id="ug-pw" type="password" placeholder="Password" aria-label="Password" autofocus>
      <button class="ug-btn" id="ug-go" type="submit">View</button>
    </form>
    <p class="ug-err" id="ug-err">Incorrect password. Try again.</p>
  </div>
</div>

<div class="ug-app" id="ug-app">
  <div class="ug-tb">
    <div class="ug-seg" role="group" aria-label="Preview device">

      <button data-mode="mobile" aria-pressed="false">

    </div>
    <span class="ug-wlabel" id="ug-wlabel">Desktop</span>
  </div>
  <div class="ug-stage" id="ug-stage">

  </div>
</div>

  var ITER = 250000, MAGIC = "UG-MOCKUP-V1\n";

  function b64ToBytes(b64){ var bin = atob(b64); var u = new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }

  async function decrypt(password){
    var all = b64ToBytes(CIPHER_B64);
    // OpenSSL format: "Salted__"(8) + salt(8) + ciphertext
    var salt = all.slice(8, 16);
    var ct = all.slice(16);
    var enc = new TextEncoder();
    var keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]);
    var bits = await crypto.subtle.deriveBits({ name:"PBKDF2", salt: salt, iterations: ITER, hash:"SHA-256" }, keyMaterial, 384);
    var kb = new Uint8Array(bits);
    var key = await crypto.subtle.importKey("raw", kb.slice(0,32), { name:"AES-CBC" }, false, ["decrypt"]);
    var iv = kb.slice(32,48);
    var plainBuf = await crypto.subtle.decrypt({ name:"AES-CBC", iv: iv }, key, ct);
    var text = new TextDecoder().decode(plainBuf);
    if(text.indexOf(MAGIC) !== 0) throw new Error("bad-password");
    return text.slice(MAGIC.length);
  }

  function initToggle(){
    var frame=document.getElementById('ug-frame'), stage=document.getElementById('ug-stage'), wlabel=document.getElementById('ug-wlabel');
    var btns=document.querySelectorAll('.ug-seg button');
    btns.forEach(function(b){
      b.addEventListener('click',function(){
        var m=b.getAttribute('data-mode');
        stage.classList.toggle('mobile', m==='mobile');
        btns.forEach(function(x){ var on=(x===b); x.classList.toggle('active',on); x.setAttribute('aria-pressed', on?'true':'false'); });
        wlabel.textContent = (m==='mobile') ? '390 px' : 'Desktop';
      });
    });
  }

  (function(){
    var form=document.getElementById('ug-form'), pw=document.getElementById('ug-pw'), go=document.getElementById('ug-go'), err=document.getElementById('ug-err');
    form.addEventListener('submit', async function(e){
      e.preventDefault();
      err.classList.remove('show');
      go.disabled = true;
      try{
        var site = await decrypt(pw.value);
        document.getElementById('ug-frame').srcdoc = site;
        initToggle();
        document.getElementById('ug-gate').style.display = 'none';
        document.getElementById('ug-app').classList.add('on');
      }catch(ex){
        go.disabled = false;
        err.classList.add('show');
        pw.value = ''; pw.focus();
      }
    });
  })();
