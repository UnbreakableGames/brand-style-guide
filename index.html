<title>Unbreakable Games — Brand Style Guide</title>
<style>
  :root{ --aqua:#57FFF1; --pink:#EC3186; --orange:#FF6A13; }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0}
  body{background:#000; color:#fff; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

  /* ---- password gate ---- */
  .ug-gate{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; background:radial-gradient(120% 90% at 50% 0%, #141417 0%, #000 60%)}
  .ug-card{width:100%; max-width:390px; text-align:center}
  .ug-mark{font-weight:800; letter-spacing:-.01em; font-size:15px; text-transform:lowercase;
    background:linear-gradient(100deg,var(--pink),var(--orange)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
  .ug-title{margin:18px 0 6px; font-size:24px; font-weight:800; letter-spacing:-.02em; text-transform:lowercase}
  .ug-sub{margin:0 0 26px; font-size:14px; line-height:1.5; color:#9a9aa2}
  .ug-form{display:flex; gap:8px}
  .ug-input{flex:1; min-width:0; padding:12px 14px; border:1px solid #2e2e34; background:#0d0d0f; color:#fff; font-size:15px; outline:none}
  .ug-input:focus{border-color:var(--aqua)}
  .ug-btn{flex:none; padding:12px 18px; border:none; background:var(--aqua); color:#000; font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; cursor:pointer}
  .ug-btn:disabled{opacity:.5; cursor:progress}
  .ug-err{min-height:18px; margin:14px 0 0; font-size:13px; color:#ff8f8f; opacity:0; transition:opacity .2s}
  .ug-err.show{opacity:1}

  /* ---- decrypted guide (fullscreen iframe) ---- */
  .ug-frame{display:none; position:fixed; inset:0; width:100%; height:100%; border:0; background:#000}
  .ug-frame.on{display:block}
</style>

<div class="ug-gate" id="ug-gate">
  <div class="ug-card">
    <div class="ug-mark">unbreakable games</div>
    <h1 class="ug-title">brand style guide</h1>
    <p class="ug-sub">This guide is password-protected. Enter the password shared with you to continue.</p>
    <form class="ug-form" id="ug-form" autocomplete="off">
      <input class="ug-input" id="ug-pw" type="password" placeholder="Password" aria-label="Password" autofocus>
      <button class="ug-btn" id="ug-go" type="submit">View</button>
    </form>
    <p class="ug-err" id="ug-err">Incorrect password. Try again.</p>
  </div>
</div>

  var ITER = 250000, MAGIC = "UG-BRAND-GUIDE-V1\n";

  function b64ToBytes(b64){ var bin=atob(b64); var u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }

  async function decrypt(password){
    var all=b64ToBytes(CIPHER_B64);
    // OpenSSL format: "Salted__"(8) + salt(8) + ciphertext
    var salt=all.slice(8,16), ct=all.slice(16);
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]);
    var bits=await crypto.subtle.deriveBits({ name:"PBKDF2", salt:salt, iterations:ITER, hash:"SHA-256" }, km, 384);
    var kb=new Uint8Array(bits);
    var key=await crypto.subtle.importKey("raw", kb.slice(0,32), { name:"AES-CBC" }, false, ["decrypt"]);
    var iv=kb.slice(32,48);
    var plainBuf=await crypto.subtle.decrypt({ name:"AES-CBC", iv:iv }, key, ct);
    var text=new TextDecoder().decode(plainBuf);
    if(text.indexOf(MAGIC)!==0) throw new Error("bad-password");
    return text.slice(MAGIC.length);
  }

  (function(){
    var form=document.getElementById('ug-form'), pw=document.getElementById('ug-pw'), go=document.getElementById('ug-go'), err=document.getElementById('ug-err');
    form.addEventListener('submit', async function(e){
      e.preventDefault();
      err.classList.remove('show'); go.disabled=true;
      try{
        var html=await decrypt(pw.value);
        var f=document.getElementById('ug-frame');
        f.srcdoc=html; f.classList.add('on');
        document.getElementById('ug-gate').style.display='none';
      }catch(ex){
        go.disabled=false; err.classList.add('show'); pw.value=''; pw.focus();
      }
    });
  })();
